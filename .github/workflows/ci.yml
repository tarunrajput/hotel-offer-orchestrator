name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.integration.yaml
      COMPOSE_PROJECT_NAME: hotel-offers-ci
      TEMPORAL_UI_PORT: "18233"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.3

      - name: Install dependencies
        run: npm ci

      - name: Run local checks
        run: npm run check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build api

      - name: Start integration dependencies
        run: docker compose up --wait --wait-timeout 90 redis temporal

      - name: Run integration tests
        run: npm run test:integration
        env:
          REDIS_URL: redis://127.0.0.1:16379
          TEMPORAL_ADDRESS: 127.0.0.1:17233

      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs --no-color redis temporal

      - name: Stop integration dependencies
        if: always()
        run: docker compose down --volumes --remove-orphans
